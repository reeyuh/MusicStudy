<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Music Listening Study</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    <strong>DEMO MODE</strong> — placeholder sounds; nothing is sent to Google Sheets.
    <button type="button" id="demo-data-btn" class="link-btn">View test data</button>
  </div>

  <main id="app" class="app">
    <section class="card center"><p>Loading…</p></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="demo-dialog" class="demo-dialog" aria-labelledby="demo-dialog-title">
    <div class="demo-dialog-head">
      <h2 id="demo-dialog-title">Demo test data</h2>
      <button type="button" class="link-btn" data-close>Close</button>
    </div>
    <p class="muted">These are the exact rows the real site would write to the <b>Responses</b> and <b>Sessions</b> tabs. Stored only in this browser.</p>
    <div class="demo-actions">
      <button type="button" class="btn small" id="demo-csv-resp">Download Responses CSV</button>
      <button type="button" class="btn small" id="demo-csv-sess">Download Sessions CSV</button>
      <button type="button" class="btn small danger" id="demo-reset">Reset demo (new participant)</button>
    </div>
    <h3>Sessions</h3>
    <div class="table-wrap" id="demo-sessions"></div>
    <h3>Responses</h3>
    <div class="table-wrap" id="demo-responses"></div>
  </dialog>

  <noscript><p class="card">This study needs JavaScript turned on.</p></noscript>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
